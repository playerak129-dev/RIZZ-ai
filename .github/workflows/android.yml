name: Android CI - RIZZ AI 2.0

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Publish APK & Test Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle installation
        run: gradle --version

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Étape 1 : compiler l'APK avant les tests.
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      # Étape 2 : vérifier que l'APK existe réellement.
      - name: Verify Debug APK output
        run: |
          echo "Checking generated APK files:"
          ls -lah app/build/outputs/apk/debug/

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: app-debug.apk was not generated or is empty."
            exit 1
          fi

          echo "SUCCESS: Debug APK exists."
          sha256sum "$APK_PATH"

      # Étape 3 : publier l'APK avant les tests.
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rizz-ai-2.0-c4rl3ntz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      # Étape 4 : exécuter les tests sans masquer leurs échecs.
      # Un échec ici fera apparaître le workflow en rouge,
      # mais l'APK aura déjà été téléversé.
      - name: Run Unit & Local Tests
        if: ${{ always() && !cancelled() }}
        run: gradle :app:testDebugUnitTest --no-daemon

      # Étape 5 : publier les rapports de tests, même en cas d'échec.
      - name: Upload Unit Test Reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rizz-ai-2.0-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn